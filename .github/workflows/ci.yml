# Cross-platform verification.
#
# This exists because a local `wails3 build` on macOS proves nothing about
# Windows or Linux: the webviews differ (WKWebView, WebView2, WebKitGTK) and
# so do the toolchains. Until this workflow is green, no claim that Bava
# "builds on all platforms" is supportable.
#
# It also verifies the assumption golden files rest on: `.gitattributes` forces
# LF for `*.svg`, so a Windows checkout must still compare byte-for-byte.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # One system failing must not hide the others; that is the whole point
      # of a matrix here.
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-latest }
          - { os: macos, runner: macos-latest }
          - { os: windows, runner: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          webview: 'true'

      - name: svelte-check
        working-directory: frontend
        run: npm run check

      - name: eslint
        working-directory: frontend
        run: npm run lint

      - name: vitest
        working-directory: frontend
        run: npm test

      # This must come before any Go step. main.go has `//go:embed
      # all:frontend/dist`, and frontend/dist is gitignored, so a fresh
      # checkout has no such directory and every Go command that compiles the
      # root package fails with "pattern all:frontend/dist: no matching files
      # found". Locally it appears to work only because a stale dist/ is
      # usually lying around.
      - name: vite build
        working-directory: frontend
        run: npm run build

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l internal main.go)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      # Both Go gates are scoped to our own packages rather than `./...`:
      # node_modules now exists at this point and ships a Go package
      # (flatted/golang), which would make these gates depend on an npm
      # dependency compiling.
      - name: go vet
        run: go vet ./internal/... .

      - name: go test
        run: go test ./internal/... .

      # Called out separately because this is the cross-platform claim that
      # matters most: identical SVG bytes from identical D2 input, everywhere.
      - name: golden files
        run: go test ./internal/render -run Golden -v

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    needs: test
    strategy:
      # One system failing must not hide the others; that is the whole point
      # of a matrix here.
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-latest }
          - { os: macos, runner: macos-latest }
          - { os: windows, runner: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          webview: 'true'
          install: 'false'
          wails: 'true'

      - name: wails3 build
        run: wails3 build

      # Each run's app, to try by hand: a download on the run's page, kept 14
      # days. Packed first, as an artifact's zip drops the file mode that lets
      # a program run. Unsigned: on macOS, allowed once in System Settings,
      # Privacy & Security (docs/testing.md).
      - name: pack the app
        shell: bash
        run: |
          name="bava-$(echo "$RUNNER_OS" | tr "[:upper:]" "[:lower:]")-${GITHUB_SHA:0:7}"
          case "$RUNNER_OS" in
            macOS)
              wails3 task darwin:create:app:bundle
              ditto -c -k --keepParent bin/bava.app "$name.zip" ;;
            Linux) tar -czf "$name.tar.gz" -C bin bava ;;
            Windows) cp bin/bava.exe "$name.exe" ;;
          esac
          echo "APP_NAME=$name" >> "$GITHUB_ENV"

      - name: upload the app
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}
          path: |
            ${{ env.APP_NAME }}.zip
            ${{ env.APP_NAME }}.tar.gz
            ${{ env.APP_NAME }}.exe
          if-no-files-found: error
          retention-days: 14

  # Browser tests: visual regression (every screen, drawn by the same browser
  # in the same pinned container as on the developer's Mac, arm64 both,
  # compared with the approved screenshots in testdata/visual) and integration
  # (behaviour in a real browser). On a failure the results are uploaded for
  # someone to look at.
  browser:
    name: browser
    runs-on: ubuntu-24.04-arm
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: npm run browser
        run: tests/scripts/browser.sh

      - name: upload results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser
          path: frontend/tests/.results/
          retention-days: 14

  # End-to-end: the real app, built with the e2e driver (-tags e2e), makes a
  # Space in a scratch folder, a page and a shape, saves, quits, reopens, and
  # checks it is all still there, taking screenshots on the way.
  walks:
    name: walks (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    needs: test
    strategy:
      # One system failing must not hide the others; that is the whole point
      # of a matrix here.
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-latest }
          - { os: macos, runner: macos-latest }
          - { os: windows, runner: windows-latest }
    env:
      VITE_BAVA_E2E: '1'
    steps:
      - uses: actions/checkout@v7
      # A virtual screen and fonts to draw on; WebKit's own sandbox kept on.
      - uses: ./.github/actions/setup
        with:
          webview: 'true'
          packages: xvfb imagemagick fonts-dejavu-core
          userns: 'true'
          install: 'false'
          wails: 'true'

      # screencapture needs the screen-recording permission; the runner image
      # lets the job grant it to the process that asks.
      - name: Allow screenshots on macOS
        if: runner.os == 'macOS'
        run: |
          for db in "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "/Library/Application Support/com.apple.TCC/TCC.db"; do
            sudo sqlite3 "$db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, indirect_object_identifier, flags) VALUES ('kTCCServiceScreenCapture', '/usr/sbin/screencapture', 1, 2, 4, 1, 'UNUSED', 0);" || true
          done

      - name: build with the smoke driver
        run: wails3 build EXTRA_TAGS=e2e

      - name: run the walks
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/smoke-out"; scratch="$RUNNER_TEMP/smoke-scratch"
          mkdir -p "$out" "$scratch"
          export BAVA_E2E_OUT="$out" BAVA_E2E_SCRATCH="$scratch"
          app=bin/bava; [[ "$RUNNER_OS" == "Windows" ]] && app=bin/bava.exe
          run() {
            export BAVA_E2E_SCENARIO="tests/e2e/$1.json"
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              # WebKitGTK without a GPU: software drawing, or the window is blank.
              WEBKIT_DISABLE_DMABUF_RENDERER=1 GSK_RENDERER=cairo LIBGL_ALWAYS_SOFTWARE=1 \
                xvfb-run -a -s "-screen 0 1440x900x24" "$app"
            else
              "$app"
            fi
          }
          # Each run must leave a PASS: the exit code alone is not trusted, and a
          # run that crashed before reporting leaves no result at all.
          for scenario in create reopen canvas export-proof import; do
            run "$scenario" || true
            result="$out/$scenario-result.txt"
            if [[ ! -f "$result" ]]; then echo "::error::$scenario left no result"; exit 1; fi
            cat "$result"
            grep -q '^PASS' "$result" || { echo "::error::$scenario failed"; exit 1; }
          done

      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: walks-${{ matrix.os }}
          path: ${{ runner.temp }}/smoke-out/
          retention-days: 14

  # The walks inside the Mac App Store's sandbox: the end-to-end build packed
  # as an .app, ad-hoc signed with the sandbox's entitlements (no account
  # needed), each walk laid out in the app's own container.
  store-walks-macos:
    name: store walks (macos)
    runs-on: macos-latest
    needs: test
    env:
      VITE_BAVA_E2E: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install: 'false'
          wails: 'true'

      - name: package the end-to-end build, signed into the sandbox
        run: |
          wails3 package EXTRA_TAGS=e2e
          codesign --force --deep --sign - --entitlements build/darwin/entitlements.sandbox.plist bin/bava.app
          codesign -d --entitlements - bin/bava.app

      - name: run the walks sandboxed
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          container="$HOME/Library/Containers/com.tharabyte.bava/Data"
          # Every walk runs, so one failing does not hide what the others show.
          failed=0
          for scenario in create reopen canvas export-proof import; do
            BAVA_E2E_SANDBOX=1 BAVA_E2E_SCENARIO="$scenario" bin/bava.app/Contents/MacOS/bava || true
            result="$container/smoke-out/$scenario-result.txt"
            if [[ ! -f "$result" ]]; then echo "::error::$scenario left no result in the sandbox"; failed=1; continue; fi
            cat "$result"
            grep -q '^PASS' "$result" || { echo "::error::$scenario failed in the sandbox"; failed=1; }
          done
          exit "$failed"

      - name: upload what the sandboxed walks left
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: store-walks-macos
          path: |
            ~/Library/Containers/com.tharabyte.bava/Data/smoke-out/
            ~/Library/Containers/com.tharabyte.bava/Data/Library/Caches/Bava/logs/
          if-no-files-found: warn
          retention-days: 14

  # The walks from an installed package, as the Microsoft Store ships Bava:
  # the end-to-end build packed as an MSIX, signed with a certificate made
  # here (no account needed), installed and started by Windows. A package
  # starts without the shell's environment, so each walk is named in
  # ~/.bava-e2e and lays itself out in the home.
  store-walks-windows:
    name: store walks (windows)
    runs-on: windows-latest
    needs: test
    env:
      VITE_BAVA_E2E: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install: 'false'
          wails: 'true'

      - name: build with the smoke driver
        run: wails3 build EXTRA_TAGS=e2e

      - name: pack, sign and install it as the Microsoft Store would
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $sdk = Split-Path $tool.FullName
          $layout = "$env:RUNNER_TEMP\msix"
          New-Item -ItemType Directory -Force "$layout\Assets" | Out-Null
          Copy-Item bin\bava.exe $layout
          Copy-Item build\windows\msix\app_manifest.xml "$layout\AppxManifest.xml"
          # The tiles' real art comes with the store work; the icon stands in.
          foreach ($tile in 'StoreLogo', 'Square150x150Logo', 'Square44x44Logo', 'Wide310x150Logo', 'SplashScreen') {
            Copy-Item build\windows\appicon-windows.png "$layout\Assets\$tile.png"
          }
          & "$sdk\makeappx.exe" pack /d $layout /p "$env:RUNNER_TEMP\bava.msix" /o
          if ($LASTEXITCODE) { throw "makeappx failed" }
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Tharabyte" -KeyUsage DigitalSignature -FriendlyName "Bava CI" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $secret = ConvertTo-SecureString -String "ci" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\ci.pfx" -Password $secret | Out-Null
          & "$sdk\signtool.exe" sign /fd SHA256 /f "$env:RUNNER_TEMP\ci.pfx" /p ci "$env:RUNNER_TEMP\bava.msix"
          if ($LASTEXITCODE) { throw "signtool failed" }
          Import-PfxCertificate -FilePath "$env:RUNNER_TEMP\ci.pfx" -CertStoreLocation Cert:\LocalMachine\TrustedPeople -Password $secret | Out-Null
          Add-AppxPackage "$env:RUNNER_TEMP\bava.msix"
          Get-AppxPackage com.tharabyte.bava | Format-List Name, PackageFamilyName, InstallLocation

      - name: run the walks from the installed package
        shell: pwsh
        timeout-minutes: 14
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-AppxPackage com.tharabyte.bava
          $out = "$env:USERPROFILE\smoke-out"
          $failed = 0
          foreach ($scenario in 'create', 'reopen', 'canvas', 'export-proof', 'import') {
            # A package starts without the shell's environment: the walk is
            # named in a file in the home. Not Set-Content, which left none.
            $runFile = Join-Path $env:USERPROFILE '.bava-e2e'
            [System.IO.File]::WriteAllText($runFile, $scenario)
            Start-Process "shell:AppsFolder\$($package.PackageFamilyName)!com.tharabyte.bava"
            Start-Sleep -Seconds 5
            $deadline = (Get-Date).AddMinutes(4)
            while ((Get-Process bava -ErrorAction SilentlyContinue) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Seconds 2 }
            Get-Process bava -ErrorAction SilentlyContinue | Stop-Process -Force
            $result = "$out\$scenario-result.txt"
            if (-not (Test-Path $result)) { Write-Host "::error::$scenario left no result in the package"; $failed = 1; continue }
            Get-Content $result
            if (-not ((Get-Content $result -First 1) -like 'PASS*')) { Write-Host "::error::$scenario failed in the package"; $failed = 1 }
          }
          Remove-Item "$env:USERPROFILE\.bava-e2e" -ErrorAction SilentlyContinue
          # Bava's logs, kept in the package's own storage.
          $cache = "$env:LOCALAPPDATA\Packages\$($package.PackageFamilyName)\LocalCache"
          New-Item -ItemType Directory -Force "$env:USERPROFILE\smoke-out\package-cache" | Out-Null
          Copy-Item -Recurse "$cache\*" "$env:USERPROFILE\smoke-out\package-cache" -ErrorAction SilentlyContinue
          exit $failed

      - name: upload what the packaged walks left
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: store-walks-windows
          path: ~/smoke-out/
          if-no-files-found: warn
          retention-days: 14

  # The walks inside Flatpak's sandbox, as Flathub ships Bava: the
  # end-to-end build packed by a test-only manifest (tests/flatpak/, never
  # the submitted one), each walk laid out in the app's own folder.
  store-walks-linux:
    name: store walks (linux)
    runs-on: ubuntu-24.04
    needs: test
    env:
      VITE_BAVA_E2E: '1'
    steps:
      - uses: actions/checkout@v7
      # Flatpak and a virtual screen; Flatpak's sandbox needs user namespaces.
      - uses: ./.github/actions/setup
        with:
          webview: 'true'
          packages: flatpak flatpak-builder xvfb dbus-x11
          userns: 'true'
          install: 'false'
          wails: 'true'

      - name: Flathub, for the runtime the manifest names
        run: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: build with the smoke driver
        run: wails3 build EXTRA_TAGS=e2e

      - name: pack and install it as a Flatpak
        run: |
          flatpak-builder --user --install-deps-from=flathub --install --force-clean \
            "$RUNNER_TEMP/flatpak-build" tests/flatpak/bava-ci.yml

      - name: run the walks sandboxed
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          data="$HOME/.var/app/com.tharabyte.bava.Devel"
          # Every walk runs, so one failing does not hide what the others show.
          failed=0
          for scenario in create reopen canvas export-proof import; do
            # WebKitGTK without a GPU: software drawing, or the window is blank.
            dbus-run-session -- xvfb-run -a -s "-screen 0 1440x900x24" \
              flatpak run \
                --env=BAVA_E2E_SANDBOX=1 --env=BAVA_E2E_SCENARIO="$scenario" \
                --env=WEBKIT_DISABLE_DMABUF_RENDERER=1 --env=GSK_RENDERER=cairo --env=LIBGL_ALWAYS_SOFTWARE=1 \
                com.tharabyte.bava.Devel || true
            result="$data/smoke-out/$scenario-result.txt"
            if [[ ! -f "$result" ]]; then echo "::error::$scenario left no result in the sandbox"; failed=1; continue; fi
            cat "$result"
            grep -q '^PASS' "$result" || { echo "::error::$scenario failed in the sandbox"; failed=1; }
          done
          exit "$failed"

      - name: upload what the sandboxed walks left
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: store-walks-linux
          path: |
            ~/.var/app/com.tharabyte.bava.Devel/smoke-out/
            ~/.var/app/com.tharabyte.bava.Devel/cache/Bava/logs/
          if-no-files-found: warn
          retention-days: 14

  # A normal build must not contain the smoke driver: its frontend bundle is
  # checked here, its Go side by release_test.go.
  release-check:
    name: release check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          go: 'false'
      - working-directory: frontend
        run: |
          npm run build
          if grep -rl "internal/e2e.Service" dist; then
            echo "::error::the release bundle contains the smoke driver"; exit 1
          fi
          # The browser tests' forced states belong to their test page only.
          if grep -rl "data-force" dist; then
            echo "::error::the release bundle contains the browser tests' forced states"; exit 1
          fi
